# リリース作成 (docs/INSTALL.md、REDESIGN §8): タグ v* を push すると、Windows ランナーで
# TIP とブローカーをタグ入りの Release でビルド・試験し、依存ピン留めを実地検証し、setup が
# 取得するアセット (DLL・ブローカー・ソース zip・各 SHA-256・タグ/ハッシュを刻んだ setup.ps1)
# を公開する。検証が1つでも失敗すればリリースは出ない。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: TIP とブローカーのビルドと試験 (Release、タグを埋め込む。登録はしない)
        shell: pwsh
        run: ./src/tip/dev-build.ps1 -Tag "${{ github.ref_name }}"

      # setup.ps1 が使う Python (同梱ランタイム 3.13) で確かめる。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 依存ピン留めの実地検証 (torch CPU + requirements + import)
        shell: pwsh
        run: |
          python -m venv .venv-verify
          .\.venv-verify\Scripts\python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
          if ($LASTEXITCODE -ne 0) { throw "torch pin failed" }
          .\.venv-verify\Scripts\python -m pip install -r packaging/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements pins failed" }
          .\.venv-verify\Scripts\python -c "import torch, transformers, sentencepiece, huggingface_hub; print('pins OK')"

      - name: モデルの固定リビジョンの存在確認
        shell: pwsh
        run: |
          $rev = (Select-String -Path packaging/fetch_model.py -Pattern '^REVISION = "([0-9a-f]+)"').Matches[0].Groups[1].Value
          $resp = Invoke-WebRequest -UseBasicParsing "https://huggingface.co/api/models/rinna/japanese-gpt2-small/revision/$rev"
          if ($resp.StatusCode -ne 200) { throw "model revision not found: $rev" }
          Write-Host "model revision OK: $rev"

      - name: アセットの組み立て
        shell: pwsh
        run: |
          git archive --format=zip -o oyayubi-ime-source.zip HEAD
          Copy-Item dist/NicolaIME3.dll .
          Copy-Item dist/oyayubi-broker.exe .
          foreach ($name in @("NicolaIME3.dll", "oyayubi-broker.exe", "oyayubi-ime-source.zip")) {
            (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() | Set-Content "$name.sha256" -Encoding ASCII -NoNewline
          }
          # setup.ps1 にタグと、同梱 Python の公式ハッシュを刻む。
          $embedName = "python-3.13.7-embed-amd64.zip"
          Invoke-WebRequest -UseBasicParsing "https://www.python.org/ftp/python/3.13.7/$embedName" -OutFile $embedName
          $embedHash = (Get-FileHash $embedName -Algorithm SHA256).Hash.ToLower()
          $setup = Get-Content packaging/setup.ps1 -Raw
          $setup = $setup -replace "__TAG__", $env:GITHUB_REF_NAME -replace "__EMBED_SHA256__", $embedHash
          # 利用者が実行するのは Windows PowerShell 5.1。BOM が無いと ANSI として読まれる。
          $setup | Set-Content setup.ps1 -Encoding utf8BOM

      - name: スクリプトの構文チェック (刻印後の実物も、利用者と同じ Windows PowerShell 5.1 で)
        shell: powershell
        run: |
          foreach ($f in @("packaging/setup.ps1", "packaging/uninstall.ps1", "packaging/elevated.ps1", "setup.ps1")) {
            $head = [IO.File]::ReadAllBytes((Resolve-Path $f)) | Select-Object -First 3
            if (($head -join ",") -ne "239,187,191") { throw "$f : missing UTF-8 BOM (Windows PowerShell 5.1 would read it as ANSI)" }
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count) { throw "$f : $($errors[0].Message)" }
            Write-Host "parse OK: $f"
          }

      # プレリリースとして公開する。README の latest URL はプレリリースを
      # 指さないので、実機でインストールを確かめてから正式にする
      # (gh release edit <tag> --prerelease=false --latest)。
      - name: リリースへ公開 (プレリリース)
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body: "インストール・更新・アンインストールは README の「インストール・更新」を参照してください。"
          files: |
            setup.ps1
            NicolaIME3.dll
            NicolaIME3.dll.sha256
            oyayubi-broker.exe
            oyayubi-broker.exe.sha256
            oyayubi-ime-source.zip
            oyayubi-ime-source.zip.sha256

  # 公開したプレリリースの setup.ps1 で、まっさらなランナーに実際に入れる (経路は 1 本)。
  # インストール → 動作 (ブローカーが ready) → 同じ版の入れ直し (学習データが残るか)
  # → アンインストール (プログラムは全部消え、利用者のデータは残るか)。
  install-test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: install, reinstall, uninstall
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # ASCII only: this step runs in Windows PowerShell 5.1.
          $ErrorActionPreference = "Stop"
          $setup = Join-Path $env:RUNNER_TEMP "oyayubi-setup.ps1"
          Invoke-WebRequest -UseBasicParsing "https://github.com/$env:REPO/releases/download/$env:TAG/setup.ps1" -OutFile $setup
          $program = Join-Path $env:ProgramFiles "oyayubi-ime\$env:TAG"
          $local = Join-Path $env:LOCALAPPDATA "oyayubi-ime"
          $userData = Join-Path $env:USERPROFILE ".oyayubi-ime"
          $inproc = "Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID\{A7C4E201-0B3A-4F11-9E61-0C1A0B7E0A01}\InprocServer32"

          function Invoke-Logged([string]$label, [string[]]$argv) {
            Write-Host "::group::$label"
            $ErrorActionPreference = "Continue"
            $out = & powershell @argv 2>&1 | ForEach-Object { "$_" }
            $code = $LASTEXITCODE
            $ErrorActionPreference = "Stop"
            $out | ForEach-Object { Write-Host $_ }
            Write-Host "::endgroup::"
            if ($code -ne 0) { throw "$label failed with exit code $code" }
          }
          function Get-BrokerState {
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $session = (Get-Process -Id $PID).SessionId
            $pipe = New-Object System.IO.Pipes.NamedPipeClientStream(".", "oyayubi-ime-$sid-$session", [IO.Pipes.PipeDirection]::InOut)
            $pipe.Connect(5000)
            $writer = New-Object IO.StreamWriter($pipe); $writer.AutoFlush = $true; $writer.NewLine = "`n"
            $reader = New-Object IO.StreamReader($pipe)
            $writer.WriteLine('{"op":"hello","proto":1,"tag":"ci","bits":64}')
            $state = ($reader.ReadLine() | ConvertFrom-Json).state
            $pipe.Dispose()
            return $state
          }
          function Assert-Installed {
            foreach ($f in @("NicolaIME3.dll", "oyayubi-broker.exe", "elevated.ps1")) {
              if (-not (Test-Path (Join-Path $program $f))) { throw "missing $f in Program Files" }
            }
            if ((Get-ItemProperty $inproc).'(default)' -ne (Join-Path $program "NicolaIME3.dll")) { throw "TIP is not registered to Program Files" }
            if ((Get-ItemProperty "HKCU:\Software\oyayubi-ime").Tag -ne $env:TAG) { throw "HKCU Tag is not $env:TAG" }
            if (-not (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run")."oyayubi-ime") { throw "no Run key" }
            if (-not (Test-Path (Join-Path $local "versions\$env:TAG\engine.json"))) { throw "no engine.json" }
            $state = Get-BrokerState
            if ($state -ne "ready") { throw "broker state is $state, not ready" }
          }

          $setupArgs = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $setup, "-Yes")
          Invoke-Logged "install" $setupArgs
          Assert-Installed
          Write-Host "install OK"

          $learning = Join-Path $userData "learning.jsonl"
          $marker = '{"ci":"learning survives a reinstall"}'
          Set-Content $learning $marker -Encoding ASCII
          Invoke-Logged "reinstall (same tag)" $setupArgs
          Assert-Installed
          if ((Get-Content $learning -Raw).Trim() -ne $marker) { throw "learning data changed during the reinstall" }
          Write-Host "reinstall OK (learning data kept)"

          $uninstall = Join-Path $local "versions\$env:TAG\app\packaging\uninstall.ps1"
          Invoke-Logged "uninstall" @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $uninstall, "-Yes")
          if (Test-Path $inproc) { throw "TIP registration remains after uninstall" }
          if (Test-Path $local) { throw "$local remains after uninstall" }
          if (Test-Path (Join-Path $env:ProgramFiles "oyayubi-ime")) { throw "Program Files\oyayubi-ime remains (nothing had the DLL loaded)" }
          if ((Get-ItemProperty "HKCU:\Software\oyayubi-ime" -ErrorAction SilentlyContinue).Tag) { throw "HKCU Tag remains" }
          if (Get-Process -Name "oyayubi-broker" -ErrorAction SilentlyContinue) { throw "a broker is still running" }
          if (-not (Test-Path $learning)) { throw "uninstall removed the learning history (I-7)" }
          Write-Host "uninstall OK (user data kept)"
