# リリース作成 (docs/INSTALL.md): タグ v* を push すると、Windows ランナーで
# TIP をビルドし、依存ピン留めを実地検証し、setup が取得するアセット
# (DLL・ソース zip・各 SHA-256・タグ/ハッシュを刻んだ setup.ps1) を公開する。
# 検証が1つでも失敗すればリリースは出ない。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: TIP DLL のビルドとテスト
        shell: pwsh
        run: ./src/tip/dev-build.ps1

      # setup.ps1 が使う Python (同梱ランタイム 3.13、venv は 3.11〜3.13) で確かめる。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 依存ピン留めの実地検証 (torch CPU + requirements + import)
        shell: pwsh
        run: |
          python -m venv .venv-verify
          .\.venv-verify\Scripts\python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
          if ($LASTEXITCODE -ne 0) { throw "torch pin failed" }
          .\.venv-verify\Scripts\python -m pip install -r packaging/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements pins failed" }
          .\.venv-verify\Scripts\python -c "import torch, transformers, sentencepiece, huggingface_hub; print('pins OK')"

      - name: モデルの固定リビジョンの存在確認
        shell: pwsh
        run: |
          $rev = (Select-String -Path packaging/fetch_model.py -Pattern '^REVISION = "([0-9a-f]+)"').Matches[0].Groups[1].Value
          $resp = Invoke-WebRequest -UseBasicParsing "https://huggingface.co/api/models/rinna/japanese-gpt2-small/revision/$rev"
          if ($resp.StatusCode -ne 200) { throw "model revision not found: $rev" }
          Write-Host "model revision OK: $rev"

      - name: アセットの組み立て
        shell: pwsh
        run: |
          git archive --format=zip -o oyayubi-ime-source.zip HEAD
          Copy-Item dist/NicolaIME3.dll .
          foreach ($name in @("NicolaIME3.dll", "oyayubi-ime-source.zip")) {
            (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() | Set-Content "$name.sha256" -Encoding ASCII -NoNewline
          }
          # setup.ps1 にタグと、同梱 Python の公式ハッシュを刻む。
          $embedName = "python-3.13.7-embed-amd64.zip"
          Invoke-WebRequest -UseBasicParsing "https://www.python.org/ftp/python/3.13.7/$embedName" -OutFile $embedName
          $embedHash = (Get-FileHash $embedName -Algorithm SHA256).Hash.ToLower()
          $setup = Get-Content packaging/setup.ps1 -Raw
          $setup = $setup -replace "__TAG__", $env:GITHUB_REF_NAME -replace "__EMBED_SHA256__", $embedHash
          # 利用者が実行するのは Windows PowerShell 5.1。BOM が無いと ANSI として読まれる。
          $setup | Set-Content setup.ps1 -Encoding utf8BOM

      - name: setup.ps1 の構文チェック (刻印後の実物も、利用者と同じ Windows PowerShell 5.1 で)
        shell: powershell
        run: |
          foreach ($f in @("packaging/setup.ps1", "packaging/uninstall.ps1", "setup.ps1")) {
            $head = [IO.File]::ReadAllBytes((Resolve-Path $f)) | Select-Object -First 3
            if (($head -join ",") -ne "239,187,191") { throw "$f : missing UTF-8 BOM (Windows PowerShell 5.1 would read it as ANSI)" }
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count) { throw "$f : $($errors[0].Message)" }
            Write-Host "parse OK: $f"
          }

      # プレリリースとして公開する。README の latest URL はプレリリースを
      # 指さないので、実機でインストールを確かめてから正式にする
      # (gh release edit <tag> --prerelease=false --latest)。
      - name: リリースへ公開 (プレリリース)
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body: "インストール・更新・アンインストールは README の「インストール・更新」を参照してください。"
          files: |
            setup.ps1
            NicolaIME3.dll
            NicolaIME3.dll.sha256
            oyayubi-ime-source.zip
            oyayubi-ime-source.zip.sha256

  # 公開したプレリリースの setup.ps1 で、まっさらなランナーに実際に入れる。
  # インストール → 更新 (学習データが残るか) → アンインストール (全部消えるか)。
  install-test:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: venv, Windows PowerShell 5.1
            launcher: powershell
            embedded: "false"
            unicode_root: "false"
            expect_route: "(venv)"
          - name: embedded runtime, started from pwsh, non-ASCII path with spaces
            launcher: pwsh
            embedded: "true"
            unicode_root: "true"
            expect_route: "embeddable"
    name: install (${{ matrix.name }})
    steps:
      # ランナーの既定の Python は torch の対応範囲より新しいので、venv 経路には
      # 対応範囲の Python を用意する (同梱経路はシステムの Python を使わない)。
      - uses: actions/setup-python@v5
        if: matrix.embedded == 'false'
        with:
          python-version: "3.12"

      - name: install, update, uninstall
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          LAUNCHER: ${{ matrix.launcher }}
          EMBEDDED: ${{ matrix.embedded }}
          UNICODE_ROOT: ${{ matrix.unicode_root }}
          EXPECT_ROUTE: ${{ matrix.expect_route }}
        run: |
          # ASCII only: this step runs in Windows PowerShell 5.1.
          $ErrorActionPreference = "Stop"
          $setup = Join-Path $env:RUNNER_TEMP "oyayubi-setup.ps1"
          Invoke-WebRequest -UseBasicParsing "https://github.com/$env:REPO/releases/download/$env:TAG/setup.ps1" -OutFile $setup
          $root = Join-Path $env:LOCALAPPDATA "oyayubi-ime"
          if ($env:UNICODE_ROOT -eq "true") {
            $jp = -join [char[]](0x30C6, 0x30B9, 0x30C8)
            $root = Join-Path $env:RUNNER_TEMP "$jp user\oyayubi ime"
          }
          $setupArgs = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $setup, "-Yes", "-InstallRoot", $root)
          if ($env:EMBEDDED -eq "true") { $setupArgs += "-EmbeddedPython" }
          $clsid = "Registry::HKEY_LOCAL_MACHINE\Software\Classes\CLSID\{A7C4E201-0B3A-4F11-9E61-0C1A0B7E0A01}"

          function Invoke-Logged([string]$label, [string[]]$argv) {
            Write-Host "::group::$label"
            # 5.1 turns a child's stderr into error records; do not stop on them.
            $ErrorActionPreference = "Continue"
            $out = & $env:LAUNCHER @argv 2>&1 | ForEach-Object { "$_" }
            $code = $LASTEXITCODE
            $ErrorActionPreference = "Stop"
            $out | ForEach-Object { Write-Host $_ }
            Write-Host "::endgroup::"
            if ($code -ne 0) { throw "$label failed with exit code $code" }
            return ($out -join "`n")
          }

          $first = Invoke-Logged "install" $setupArgs
          if ($first -notmatch "PowerShell: 5\.1") { throw "setup did not run in Windows PowerShell 5.1" }
          if (-not $first.Contains($env:EXPECT_ROUTE)) { throw "expected the $env:EXPECT_ROUTE Python route" }
          if (-not (Test-Path $clsid)) { throw "TIP is not registered" }
          $learning = Join-Path $root "app\data\learning.jsonl"
          if (-not (Test-Path $learning)) { throw "learning file was not created" }
          Write-Host "install OK"

          $marker = '{"ci":"learning survives an update"}'
          Set-Content $learning $marker -Encoding ASCII
          $second = Invoke-Logged "update" $setupArgs
          if ($second -notmatch "PowerShell: 5\.1") { throw "update did not run in Windows PowerShell 5.1" }
          if ((Get-Content $learning -Raw).Trim() -ne $marker) { throw "learning data changed during the update" }
          Write-Host "update OK (learning data kept)"

          $uninstall = Join-Path $root "app\packaging\uninstall.ps1"
          $null = Invoke-Logged "uninstall" @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $uninstall, "-InstallRoot", $root)
          if (Test-Path $root) { throw "install root remains after uninstall" }
          if (Test-Path $clsid) { throw "TIP registration remains after uninstall" }
          Write-Host "uninstall OK"
